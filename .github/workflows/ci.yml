name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26.13.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Cheap, fast quality gates first — run in parallel, fail fast
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint:check

  prettier:
    name: Format check (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Prettier check
        run: npm run prettier:check

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@7a4b4b7c7d7b7c7d7b7c7d7b7c7d7b7c7d7b7c7d # v2.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Type-check (tsc) — separate job so it can run in parallel with lint/format
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type-check (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit --project tsconfig.json

  # ---------------------------------------------------------------------------
  # Test in Docker (the real, container-verified test gate)
  # ---------------------------------------------------------------------------
  test:
    name: Test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, prettier, secret-scan, typecheck]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build test stage image
        run: docker build --target test -t ${{ env.IMAGE_NAME }}:test .
      - name: Run tests
        run: docker run --rm ${{ env.IMAGE_NAME }}:test

  # ---------------------------------------------------------------------------
  # Build stage (tsc compile) — verifies the app can produce a runtime artifact
  # ---------------------------------------------------------------------------
  build:
    name: Build (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, prettier, secret-scan, typecheck]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build build stage image
        run: docker build --target build -t ${{ env.IMAGE_NAME }}:build .

  # ---------------------------------------------------------------------------
  # Dependency vulnerability scan (npm audit) — runs in parallel with build/test
  # ---------------------------------------------------------------------------
  dep-audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, prettier, secret-scan, typecheck]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Audit (production deps only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Container image vulnerability scan (docker scout) — on prod-deps stage
  # ---------------------------------------------------------------------------
  image-scan:
    name: Image scan (Docker Scout)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, prettier, secret-scan, typecheck]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build prod-deps stage
        run: docker build --target prod-deps -t ${{ env.IMAGE_NAME }}:prod-deps .
      - name: Scan image
        run: docker scout cves ${{ env.IMAGE_NAME }}:prod-deps --exit-code --only-severity critical,high
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Full Docker build validation (runtime stage) — only on main/tags, not fork PRs
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build (runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build runtime image
        run: docker build --target runtime -t ${{ env.IMAGE_NAME }}:runtime .
      - name: Validate image runs
        run: |
          docker run --rm -d --name smoke-test -p 5000:5000 ${{ env.IMAGE_NAME }}:runtime
          sleep 5
          curl -f http://localhost:5000/health/live || (docker logs smoke-test && exit 1)
          docker stop smoke-test

  # ---------------------------------------------------------------------------
  # Publish to GHCR — only on tags, from protected branch
  # ---------------------------------------------------------------------------
  publish:
    name: Publish (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318d8f33e4d3a3e7c6c5c5c5c5c5c5c5c5 # v3.10.0
      - name: Log in to GHCR
        uses: docker/login-action@74a5d56c8b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b9 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@471d1dc4e0e6e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4 # v6.15.0
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true